<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence — daily efficiency</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◎</text></svg>">

<!-- Add to Home Screen. On an iPhone this is worth more than it looks: the app gets its
     own icon and no browser chrome, and Safari is far less likely to sweep away the
     stored days of someone who hasn't opened it for a week. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cadence">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand"><span class="brand-mark">◎</span> Cadence</div>
    <div class="topbar-right">
      <div class="profile-switch">
        <button id="profileBtn" class="profile-btn" aria-haspopup="true" aria-expanded="false">
          <span id="profileAvatar" class="avatar">🙂</span>
          <span id="profileName">—</span>
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div id="profileMenu" class="menu" hidden></div>
      </div>
      <button id="themeBtn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
  </div>
  <nav class="wrap tabs" id="tabs">
    <button class="tab is-active" data-view="today">Day</button>
    <button class="tab" data-view="tasks">Tasks</button>
    <button class="tab" data-view="trends">Trends</button>
    <button class="tab" data-view="calendar">Calendar</button>
    <button class="tab" data-view="journal">Journal</button>
    <button class="tab" data-view="settings">Settings</button>
  </nav>
</header>

<main class="wrap" id="view"></main>

<div id="toast" class="toast" hidden></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="app.js"></script>
</body>
</html>
